name: ISO candidate integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build candidate with ArchISO
        run: |
          docker run --rm --privileged --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              sed -i "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" /etc/pacman.conf
              pacman -Syu --noconfirm archlinux-keyring
              pacman -S --noconfirm archiso python make
              make lint test
              make build
            '

      - name: Record candidate checksum
        id: candidate
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist/candidate
          iso="$(find dist/candidate -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          file "$iso"
          sha256sum "$iso" | tee dist/candidate/SHA256SUMS
          echo "iso_path=$GITHUB_WORKSPACE/$iso" >> "$GITHUB_OUTPUT"

      - name: Upload candidate ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-arch-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Install UEFI VM test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            imagemagick ovmf qemu-system-gui qemu-system-x86 tesseract-ocr xvfb

      - name: Boot candidate in UEFI QEMU
        env:
          ISO: ${{ steps.candidate.outputs.iso_path }}
        run: |
          set -euo pipefail
          test -s "$ISO"
          ls -l /usr/share/OVMF /usr/share/edk2/x64 2>/dev/null || true
          sudo chown "$(id -u):$(id -g)" dist
          mkdir -p dist/boot-evidence
          timeout 180 xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            bash -euo pipefail -c '
              make boot ISO="$ISO" > "$GITHUB_WORKSPACE/dist/boot-evidence/qemu-boot.log" 2>&1 &
              qemu_pid=$!
              trap "kill $qemu_pid 2>/dev/null || true; wait $qemu_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 30); do
                sleep 5
                import -display "$DISPLAY" -window root "$GITHUB_WORKSPACE/dist/boot-evidence/iso-boot.png"
                text="$(tesseract "$GITHUB_WORKSPACE/dist/boot-evidence/iso-boot.png" stdout 2>/dev/null || true)"
                if printf "%s\n" "$text" | grep -qi "Personal Arch live recovery environment"; then
                  printf "%s\n" "$text"
                  exit 0
                fi
                if ! kill -0 "$qemu_pid" 2>/dev/null; then
                  cat "$GITHUB_WORKSPACE/dist/boot-evidence/qemu-boot.log"
                  exit 1
                fi
              done
              cat "$GITHUB_WORKSPACE/dist/boot-evidence/qemu-boot.log"
              printf "%s\n" "$text"
              exit 1
            '

      - name: Upload UEFI boot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: personal-arch-boot-evidence
          path: |
            dist/boot-evidence/
          if-no-files-found: ignore
          retention-days: 7
